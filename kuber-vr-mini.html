<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08111f">
  <title>KuberVR-mini - KuberAI</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow glow-a"></div>
  <div class="bg-glow glow-b"></div>

  <header class="site-header">
    <a class="brand" href="./">
      <span class="brand-mark">K</span>
      <span>KuberAI</span>
    </a>

    <nav class="nav-links">
      <a href="./">首页</a>
      <a href="#files">文件</a>
      <a href="#demo">试听</a>
    </nav>

    <a class="nav-action" href="#demo">试听示例</a>
  </header>

  <main>
    <section class="model-hero">
      <p class="eyebrow">KUBERAI MODEL</p>
      <h1>KuberVR-mini</h1>
      <p class="summary">轻量级人声剔除 / 人声分离模型</p>
    </section>

    <section class="section runtime-section" id="files">
      <div class="section-head">
        <p class="eyebrow">FILES</p>
        <h2>模型文件</h2>
      </div>

      <div class="runtime-grid">
        <div>
          <span>FP32 全量模型</span>
          <strong>22MB</strong>
        </div>
        <div>
          <span>Android ONNX</span>
          <strong>7MB</strong>
        </div>
        <div>
          <span>Android 推理</span>
          <strong>约 30 秒</strong>
        </div>
        <div>
          <span>RTX 推理</span>
          <strong>约 3 秒</strong>
        </div>
      </div>
    </section>

    <section class="section audio-section" id="demo">
      <div class="section-head">
        <p class="eyebrow">DEMO</p>
        <h2>试听示例</h2>
      </div>

      <div class="audio-group">
        <h3>日语示例</h3>

        <div class="audio-row">
          <span>原曲</span>
          <audio class="demo-audio" controls preload="metadata" src="./audio/jp-original.mp3"></audio>
          <a href="https://raw.githubusercontent.com/HuberHaYu/KuberAI-net/main/audio/jp-original.mp3" download>下载</a>
        </div>

        <div class="audio-row">
          <span>伴奏</span>
          <audio class="demo-audio" controls preload="metadata" src="./audio/jp-instrumental.mp3"></audio>
          <a href="https://raw.githubusercontent.com/HuberHaYu/KuberAI-net/main/audio/jp-instrumental.mp3" download>下载</a>
        </div>
      </div>

      <div class="audio-group">
        <h3>中文示例</h3>

        <div class="audio-row">
          <span>原曲</span>
          <audio class="demo-audio" controls preload="metadata" src="./audio/cn-original.mp3"></audio>
          <a href="https://raw.githubusercontent.com/HuberHaYu/KuberAI-net/main/audio/cn-original.mp3" download>下载</a>
        </div>

        <div class="audio-row">
          <span>伴奏</span>
          <audio class="demo-audio" controls preload="metadata" src="./audio/cn-instrumental.mp3"></audio>
          <a href="https://raw.githubusercontent.com/HuberHaYu/KuberAI-net/main/audio/cn-instrumental.mp3" download>下载</a>
        </div>
      </div>
    </section>
  </main>

  <script src="./main.js"></script>
</body>
</html>
